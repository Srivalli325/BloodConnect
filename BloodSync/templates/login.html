<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - BloodConnect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:#f8fafc;
}

/* NAVBAR */

.navbar{
    background:rgba(15,23,42,.95);
    padding:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.navbar-brand{
    font-size:30px;
    font-weight:800;
    color:#dc2626 !important;
}

.nav-link{
    color:#f8fafc !important;
    margin-left:20px;
    font-weight:600;
}

.nav-link:hover{
    color:#dc2626 !important;
}

/* LOGIN */

.login-wrapper{
    min-height:calc(100vh - 140px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-card{
    background:#1e293b;
    width:100%;
    max-width:430px;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.08);
}

.login-card h2{
    text-align:center;
    color:#dc2626;
    font-weight:800;
    margin-bottom:30px;
}

label{
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    height:50px;
    border-radius:12px;
    border:none;
    margin-bottom:15px;
}

.form-control:focus{
    box-shadow:0 0 10px rgba(220,38,38,.4);
}

.btn-login{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#dc2626;
    color:white;
    font-weight:700;
    transition:.3s;
}

.btn-login:hover{
    background:white;
    color:#dc2626;
}

/* FORGOT PASSWORD */
.forgot{
    text-align:right;
    margin-top:-10px;
    margin-bottom:15px;
}

.forgot a{
    color:#dc2626;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}

.forgot a:hover{
    text-decoration:underline;
}

.extra-text{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
}

.extra-text a{
    color:#dc2626;
    text-decoration:none;
    font-weight:bold;
}

.extra-text a:hover{
    text-decoration:underline;
}

footer{
    background:#020617;
    color:#94a3b8;
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="/">
BloodConnect
</a>

<div>

<a href="/" class="nav-link d-inline">Home</a>
<a href="/donors/" class="nav-link d-inline">Donors</a>
<a href="/requests/" class="nav-link d-inline">Requests</a>

</div>

</div>

</nav>

<!-- LOGIN -->

<div class="login-wrapper">

<div class="login-card">

<h2>Login</h2>

{% if error %}
<div class="alert alert-danger text-center">
{{ error }}
</div>
{% endif %}

<form method="POST">
{% csrf_token %}

<!-- USERNAME -->
<div class="mb-3">
<label>Username</label>
<input type="text" name="username" class="form-control" placeholder="Enter Username" required>
</div>

<!-- EMAIL -->
<div class="mb-3">
<label>Email Address</label>
<input type="email" name="email" class="form-control" placeholder="Enter Email Address" required>
</div>

<!-- PASSWORD -->
<div class="mb-2">
<label>Password</label>
<input type="password" name="password" class="form-control" placeholder="Enter Password" required>
</div>

<!-- FORGOT PASSWORD -->
<div class="forgot">
<a href="{% url 'forgot_password' %}">Forgot Password?</a>
</div>

<!-- USER TYPE -->
<div class="mb-3">
<label>Login As</label>
<select name="user_type" class="form-control" required>
<option value="">Select User Type</option>
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
</div>

<!-- BUTTON -->
<button type="submit" class="btn-login">
Login
</button>

</form>

<!-- REGISTER LINK -->
<div class="extra-text">
Don't have an account?
<a href="{% url 'register' %}">Register Here</a>
</div>

</div>

</div>

<!-- FOOTER -->

<footer>
© 2026 BloodConnect • Save Lives Every Day
</footer>

</body>
</html>
