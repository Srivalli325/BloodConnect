<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - BloodConnect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:#f8fafc;
}

/* NAVBAR */
.navbar{
    background:rgba(15,23,42,.95);
    padding:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.navbar-brand{
    font-size:30px;
    font-weight:800;
    color:#dc2626 !important;
}

.nav-link{
    color:#f8fafc !important;
    margin-left:20px;
    font-weight:600;
}

.nav-link:hover{
    color:#dc2626 !important;
}

/* WRAPPER */
.reset-wrapper{
    min-height:calc(100vh - 140px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* CARD */
.reset-card{
    background:#1e293b;
    width:100%;
    max-width:420px;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.08);
}

.reset-card h2{
    text-align:center;
    color:#dc2626;
    font-weight:800;
    margin-bottom:10px;
}

.reset-card p{
    text-align:center;
    color:#94a3b8;
    margin-bottom:25px;
}

label{
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    height:50px;
    border-radius:12px;
    border:none;
    margin-bottom:15px;
}

.form-control:focus{
    box-shadow:0 0 10px rgba(220,38,38,.4);
}

/* BUTTON */
.btn-reset{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#dc2626;
    color:white;
    font-weight:700;
    transition:.3s;
}

.btn-reset:hover{
    background:white;
    color:#dc2626;
}

/* ERROR */
.alert{
    font-size:14px;
    text-align:center;
}

/* FOOTER */
footer{
    background:#020617;
    color:#94a3b8;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="/">BloodConnect</a>

<div>
<a href="/" class="nav-link d-inline">Home</a>
<a href="/login/" class="nav-link d-inline">Login</a>
</div>

</div>

</nav>

<!-- RESET PASSWORD -->
<div class="reset-wrapper">

<div class="reset-card">

<h2>Reset Password</h2>

<p>Enter your new password below</p>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">
{% csrf_token %}

<!-- NEW PASSWORD -->
<div>
<label>New Password</label>
<input type="password" name="new_password" class="form-control" required>
</div>

<!-- CONFIRM PASSWORD -->
<div>
<label>Confirm Password</label>
<input type="password" name="confirm_password" class="form-control" required>
</div>

<!-- BUTTON -->
<button type="submit" class="btn-reset">
Reset Password
</button>

</form>

</div>

</div>

<!-- FOOTER -->
<footer>
© 2026 BloodConnect • Password Reset System
</footer>

</body>
</html>
