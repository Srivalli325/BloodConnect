<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:#f8fafc;
}

.navbar{
    background:rgba(15,23,42,.95);
    padding:15px;
}

.navbar-brand{
    color:#dc2626 !important;
    font-weight:800;
    font-size:28px;
}

.nav-link{
    color:white !important;
    margin-left:15px;
}

.nav-link:hover{
    color:#dc2626 !important;
}

.wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.card-box{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:450px;
}

h2{
    text-align:center;
    color:#dc2626;
    margin-bottom:20px;
}

.form-control{
    margin-bottom:15px;
    height:45px;
    border-radius:10px;
}

.btn{
    width:100%;
    background:#dc2626;
    color:white;
    font-weight:bold;
}

.btn:hover{
    background:white;
    color:#dc2626;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="navbar-brand" href="/">BloodConnect</a>
    <a class="nav-link d-inline" href="/">Home</a>
    <a class="nav-link d-inline" href="/login/">Login</a>
</nav>

<div class="wrapper">
<div class="card-box">

<h2>Forgot Password</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}

<input type="text" name="username" class="form-control" placeholder="Username" required>

<select name="security_question" class="form-control" required>
    <option value="">Select Security Question</option>
    <option value="pet">What is your first pet's name?</option>
    <option value="school">What is your first school name?</option>
    <option value="city">Which city were you born in?</option>
    <option value="friend">Who is your childhood best friend?</option>
</select>

<input type="text" name="security_answer" class="form-control" placeholder="Answer" required>

<button class="btn">Verify</button>

</form>

</div>
</div>

</body>
</html>
